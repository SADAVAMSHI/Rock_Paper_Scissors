<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock, Paper, Scissors</h1>
        
        <div class="choices">
            <button id="rock" class="choice-btn">Rock ✊</button>
            <button id="paper" class="choice-btn">Paper ✋</button>
            <button id="scissors" class="choice-btn">Scissors ✌️</button>
        </div>

        <div class="results">
            <p>You chose: <span id="user-choice">--</span></p>
            <p>Computer chose: <span id="computer-choice">--</span></p>
            <h2 id="result-text">Let's Play!</h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
